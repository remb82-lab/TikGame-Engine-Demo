name: Deploy showcase to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Pin stable npm
        run: npm install -g npm@11.19.1

      - name: Install
        run: npm install

      - name: Security review
        run: npm run security

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      # Public Pages mirror is intentionally separate from the private canonical repository.
      # /ceiling stays on the production mirror. /ceiling-core-v2-preview is isolated field QA.
      - name: Bundle Stretch Ceiling Calculator
        run: |
          git clone --depth 1 https://github.com/remb82-lab/remb82-lab.git /tmp/public-pages
          node /tmp/public-pages/pages/ceiling-core-v2-gate/tests-core-costing-v2.mjs
          node --check /tmp/public-pages/pages/ceiling-core-v2-preview/preview.mjs
          grep -q 'ПОТОЛКИ · v3 · core-v2' /tmp/public-pages/pages/ceiling-core-v2-preview/index.html
          mkdir -p dist/ceiling dist/ceiling-core-v2-preview
          cp -a /tmp/public-pages/pages/stretch-ceiling/. dist/ceiling/
          cp -a /tmp/public-pages/pages/ceiling-core-v2-preview/. dist/ceiling-core-v2-preview/

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

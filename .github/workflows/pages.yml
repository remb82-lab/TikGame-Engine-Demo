name: Deploy showcase to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Pin stable npm
        run: npm install -g npm@11.19.1

      - name: Install
        run: npm install

      - name: Security review
        run: npm run security

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      # Public mirror contains the full offline calculator, LumFer price DB and Telegram Mini App route.
      - name: Bundle Stretch Ceiling Calculator
        run: |
          git clone --depth 1 https://github.com/remb82-lab/remb82-lab.git /tmp/public-pages
          mkdir -p dist/ceiling
          cp -a /tmp/public-pages/pages/stretch-ceiling/. dist/ceiling/

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
